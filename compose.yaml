services:
  app:
    build: .
    user: "1000:1000"
    read_only: true
    mem_limit: 256m
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    ports:
      - "${APP_PORT:-8080}:${PORT:-8000}"
    environment:
      PORT: "${PORT:-8000}"
      GREETING: "${GREETING:-Hello, Docker!}"
      STORAGE: "${STORAGE:-redis}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT', '8000') + '/readyz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis_data:
